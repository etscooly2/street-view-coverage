<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Street View Coverage Dashboard</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 330px;
      background: #181b2a;
      border-right: 1px solid #2d3248;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      z-index: 1000;
      box-shadow: 4px 0 15px rgba(0,0,0,0.3);
    }

    h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.8rem;
      color: #a6adc8;
      font-weight: 500;
    }

    input[type="text"] {
      background: #11131f;
      border: 1px solid #313752;
      color: #cdd6f4;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    .btn-analyze {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 0.75rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-analyze:hover {
      background: #7dd3fc;
    }

    .btn-analyze:disabled {
      background: #45475a;
      color: #7f849c;
      cursor: not-allowed;
    }

    .results-card {
      background: #11131f;
      border: 1px solid #313752;
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .results-card h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #a6adc8;
    }

    .coverage-value {
      font-size: 2.2rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .status-text {
      font-size: 0.8rem;
      color: #9399b2;
    }

    .legend {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 0.85rem;
      margin-top: auto;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .legend-color {
      width: 14px;
      height: 4px;
      border-radius: 2px;
    }

    #map {
      flex: 1;
      height: 100%;
      background: #0d0f17;
    }

    .progress-bar-bg {
      background: #313752;
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 0.25rem;
    }

    .progress-bar-fill {
      background: #38bdf8;
      height: 100%;
      width: 0%;
      transition: width 0.2s ease;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>World Coverage Dashboard</h2>

    <div class="input-group">
      <label for="bbox-input">Bounding Box (South, West, North, East)</label>
      <input type="text" id="bbox-input" value="42.605, 20.575, 42.625, 20.605" />
    </div>

    <button id="analyze-btn" class="btn-analyze">Analyze Local Area</button>

    <div class="results-card">
      <h3>Area Coverage</h3>
      <div id="coverage-pct" class="coverage-value">0.0%</div>
      <div class="progress-bar-bg">
        <div id="progress-fill" class="progress-bar-fill"></div>
      </div>
      <div id="status-label" class="status-text">Ready</div>
    </div>

    <div class="legend">
      <div class="legend-item">
        <div class="legend-color" style="background: #0088ff;"></div>
        <span>Wikipedia SV Covered Nations (Blue)</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: #a6e3a1;"></div>
        <span>Analyzed Covered Segment</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: #f38ba8;"></div>
        <span>Analyzed Missing Segment</span>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // ISO-3 Codes for countries listed on Wikipedia with official/full Google Street View coverage
    const streetViewCountries = new Set([
      "USA", "CAN", "MEX", "GRL", "FRA", "ESP", "PRT", "ITA", "DEU", "GBR", "IRL", "NLD", "BEL", 
      "CHE", "AUT", "DNK", "SWE", "NOR", "FIN", "POL", "CZE", "SVK", "HUN", "ROU", "BGR", "GRC", 
      "HRV", "SVN", "SRB", "MNE", "ALB", "MKD", "TUR", "EST", "LVA", "LTU", "UKR", "RUS", "JPN", 
      "KOR", "TWN", "PHL", "MYS", "SGP", "IDN", "THA", "VNM", "KHM", "LKA", "BGD", "IND", "AUS", 
      "NZL", "ZAF", "BWA", "SWZ", "LSO", "KEN", "NGA", "GHA", "SEN", "RWA", "UGA", "BRA", "ARG", 
      "CHL", "COL", "PER", "ECU", "URY", "BOL", "PRY"
    ]);

    // Initialize map with global view
    const map = L.map('map', {
      center: [20.0, 0.0],
      zoom: 3,
      minZoom: 2
    });

    // Dark Basemap
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);

    // Dynamic blue tile overlay from Google Street View
    L.tileLayer('https://mt{s}.google.com/vt/lyrs=sv&x={x}&y={y}&z={z}', {
      subdomains: ['0', '1', '2', '3'],
      maxZoom: 20,
      opacity: 0.65
    }).addTo(map);

    // Fetch world country boundaries to fill blue lines across all Wikipedia covered nations
    fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
      .then(res => res.json())
      .then(geoJsonData => {
        L.geoJSON(geoJsonData, {
          style: function(feature) {
            const isCovered = streetViewCountries.has(feature.id);
            return {
              fillColor: isCovered ? '#0088ff' : 'transparent',
              fillOpacity: isCovered ? 0.25 : 0,
              color: isCovered ? '#0088ff' : '#2d3248',
              weight: isCovered ? 1.5 : 0.5,
              opacity: isCovered ? 0.8 : 0.2
            };
          }
        }).addTo(map);
      })
      .catch(err => console.error("Could not load country boundaries:", err));

    let bboxRectangle = null;
    let analyzedLayers = L.layerGroup().addTo(map);

    const analyzeBtn = document.getElementById('analyze-btn');
    const bboxInput = document.getElementById('bbox-input');
    const coveragePctElem = document.getElementById('coverage-pct');
    const progressFill = document.getElementById('progress-fill');
    const statusLabel = document.getElementById('status-label');

    function parseBBox(str) {
      const parts = str.split(',').map(n => parseFloat(n.trim()));
      if (parts.length !== 4 || parts.some(isNaN)) return null;
      return { south: parts[0], west: parts[1], north: parts[2], east: parts[3] };
    }

    // JSONP metadata lookup function
    function checkStreetViewCoverageJSONP(lat, lng) {
      return new Promise((resolve) => {
        const callbackName = 'cbk_' + Math.random().toString(36).substr(2, 9);
        const script = document.createElement('script');
        
        const timeout = setTimeout(() => {
          cleanup();
          resolve(false);
        }, 3000);

        function cleanup() {
          clearTimeout(timeout);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[callbackName] = function(data) {
          cleanup();
          resolve(!!(data && data.Location && data.Location.panoId));
        };

        script.src = `https://cbks0.google.com/cbk?output=json&ll=${lat},${lng}&cb=${callbackName}`;
        script.onerror = function() {
          cleanup();
          resolve(false);
        };

        document.body.appendChild(script);
      });
    }

    analyzeBtn.addEventListener('click', async () => {
      const bbox = parseBBox(bboxInput.value);
      if (!bbox) {
        alert('Invalid Bounding Box format! Use: South, West, North, East');
        return;
      }

      analyzeBtn.disabled = true;
      analyzedLayers.clearLayers();
      statusLabel.innerText = 'Fetching road network...';
      coveragePctElem.innerText = '0.0%';
      progressFill.style.width = '0%';

      const bounds = [[bbox.south, bbox.west], [bbox.north, bbox.east]];
      if (bboxRectangle) map.removeLayer(bboxRectangle);
      bboxRectangle = L.rectangle(bounds, { color: "#38bdf8", weight: 2, fillOpacity: 0.05 }).addTo(map);
      map.fitBounds(bounds);

      const overpassQuery = `[out:json][timeout:25];
(
  way["highway"](${bbox.south},${bbox.west},${bbox.north},${bbox.east});
);
out body;
>;
out skel qt;`;

      try {
        const response = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: overpassQuery
        });

        if (!response.ok) throw new Error('Overpass network error');

        const data = await response.json();
        const nodes = {};
        
        data.elements.forEach(el => {
          if (el.type === 'node') {
            nodes[el.id] = [el.lat, el.lon];
          }
        });

        const ways = data.elements.filter(el => el.type === 'way');
        if (ways.length === 0) {
          statusLabel.innerText = 'No roads found in this area.';
          analyzeBtn.disabled = false;
          return;
        }

        const samplePoints = [];
        ways.forEach(way => {
          for (let i = 0; i < way.nodes.length - 1; i++) {
            const p1 = nodes[way.nodes[i]];
            const p2 = nodes[way.nodes[i+1]];
            if (p1 && p2) {
              const midLat = (p1[0] + p2[0]) / 2;
              const midLng = (p1[1] + p2[1]) / 2;
              samplePoints.push({ lat: midLat, lng: midLng, p1, p2 });
            }
          }
        });

        if (samplePoints.length === 0) {
          statusLabel.innerText = 'No geometry points extracted.';
          analyzeBtn.disabled = false;
          return;
        }

        statusLabel.innerText = `Testing ${samplePoints.length} segments...`;

        let coveredCount = 0;
        let checkedCount = 0;
        const batchSize = 5;

        for (let i = 0; i < samplePoints.length; i += batchSize) {
          const batch = samplePoints.slice(i, i + batchSize);
          
          await Promise.all(batch.map(async (point) => {
            const hasSV = await checkStreetViewCoverageJSONP(point.lat, point.lng);
            if (hasSV) coveredCount++;

            const lineColor = hasSV ? '#a6e3a1' : '#f38ba8';
            L.polyline([point.p1, point.p2], { color: lineColor, weight: 4, opacity: 0.95 }).addTo(analyzedLayers);
          }));

          checkedCount += batch.length;
          const currentPct = ((coveredCount / checkedCount) * 100).toFixed(1);
          coveragePctElem.innerText = `${currentPct}%`;
          progressFill.style.width = `${(checkedCount / samplePoints.length) * 100}%`;
          statusLabel.innerText = `Analyzing... (${checkedCount}/${samplePoints.length})`;
        }

        const finalPct = ((coveredCount / samplePoints.length) * 100).toFixed(1);
        coveragePctElem.innerText = `${finalPct}%`;
        statusLabel.innerText = `Done! (${coveredCount}/${samplePoints.length} covered)`;

      } catch (err) {
        console.error(err);
        statusLabel.innerText = 'Error fetching data. Please try again.';
      } finally {
        analyzeBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
