<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Country & Percentage Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: #1e293b;
      --card-bg: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #475569;
      --accent: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: var(--panel-bg);
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      background-color: var(--bg-dark);
      padding: 0.25rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      font-weight: 600;
      font-size: 0.875rem;
      border-radius: 0.375rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: var(--text-main);
    }

    .tab-btn.active {
      background-color: var(--primary);
      color: #ffffff;
    }

    .main-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .tab-content {
      display: none;
      width: 100%;
      height: 100%;
    }

    .tab-content.active {
      display: block;
    }

    #map {
      width: 100%;
      height: 100%;
      background-color: #0b1120;
    }

    .list-container {
      height: 100%;
      overflow-y: auto;
      padding: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .search-bar {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      color: var(--text-main);
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }

    .search-bar:focus {
      outline: 2px solid var(--primary);
    }

    .country-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      padding-bottom: 2rem;
    }

    .country-card {
      background-color: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .country-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .country-name {
      font-weight: 600;
      font-size: 1rem;
    }

    .country-percentage {
      font-weight: 700;
      color: var(--accent);
      font-size: 1.125rem;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background-color: var(--card-bg);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: var(--accent);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .stats-container {
      height: 100%;
      overflow-y: auto;
      padding: 2rem 1.5rem;
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .summary-card {
      background-color: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 2rem;
      text-align: center;
    }

    .summary-title {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .summary-value {
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 1rem;
    }

    .summary-subtext {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }

    .stat-box {
      background-color: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1.25rem;
    }

    .stat-box-title {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .stat-box-value {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .info-legend {
      background-color: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1rem;
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      font-size: 0.85rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.25rem;
    }

    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <header>
    <h1>World Percentage Dashboard</h1>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('map-view')">Map View</button>
      <button class="tab-btn" onclick="switchTab('list-view')">Countries List</button>
      <button class="tab-btn" onclick="switchTab('percent-view')">% World Summary</button>
    </div>
  </header>

  <div class="main-container">
    <div id="map-view" class="tab-content active">
      <div id="map"></div>
      <div class="info-legend">
        <strong>Percentage Scale</strong>
        <div class="legend-item"><div class="legend-color" style="background: #10b981;"></div> 80% - 100%</div>
        <div class="legend-item"><div class="legend-color" style="background: #3b82f6;"></div> 50% - 79%</div>
        <div class="legend-item"><div class="legend-color" style="background: #f59e0b;"></div> 20% - 49%</div>
        <div class="legend-item"><div class="legend-color" style="background: #ef4444;"></div> 1% - 19%</div>
        <div class="legend-item"><div class="legend-color" style="background: #334155;"></div> 0%</div>
      </div>
    </div>

    <div id="list-view" class="tab-content">
      <div class="list-container">
        <input type="text" id="countrySearch" class="search-bar" placeholder="Search country name..." oninput="filterCountries()">
        <div class="country-grid" id="countryGrid"></div>
      </div>
    </div>

    <div id="percent-view" class="tab-content">
      <div class="stats-container">
        <div class="summary-card">
          <div class="summary-title">Total World Score / Percentage</div>
          <div class="summary-value" id="totalWorldPercent">0.00%</div>
          <div class="summary-subtext">Calculated as the average percentage score across all recognized world countries.</div>
        </div>

        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-box-title">Total Countries</div>
            <div class="stat-box-value" id="totalCount">195</div>
          </div>
          <div class="stat-box">
            <div class="stat-box-title">At 100% Score</div>
            <div class="stat-box-value" id="hundredCount" style="color: #10b981;">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-box-title">Above 50% Score</div>
            <div class="stat-box-value" id="aboveFiftyCount" style="color: #3b82f6;">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-box-title">At 0% Score</div>
            <div class="stat-box-value" id="zeroCount" style="color: #ef4444;">0</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const countryData = [
      { name: "United States of America", iso: "USA", percentage: 100 },
      { name: "Canada", iso: "CAN", percentage: 90 },
      { name: "United Kingdom", iso: "GBR", percentage: 85 },
      { name: "Germany", iso: "DEU", percentage: 80 },
      { name: "France", iso: "FRA", percentage: 75 },
      { name: "Japan", iso: "JPN", percentage: 95 },
      { name: "Australia", iso: "AUS", percentage: 85 },
      { name: "Brazil", iso: "BRA", percentage: 60 },
      { name: "India", iso: "IND", percentage: 70 },
      { name: "China", iso: "CHN", percentage: 65 },
      { name: "Italy", iso: "ITA", percentage: 70 },
      { name: "Spain", iso: "ESP", percentage: 75 },
      { name: "Mexico", iso: "MEX", percentage: 50 },
      { name: "South Korea", iso: "KOR", percentage: 90 },
      { name: "Netherlands", iso: "NLD", percentage: 80 },
      { name: "Argentina", iso: "ARG", percentage: 45 },
      { name: "South Africa", iso: "ZAF", percentage: 40 },
      { name: "Saudi Arabia", iso: "SAU", percentage: 55 },
      { name: "Egypt", iso: "EGY", percentage: 35 },
      { name: "Nigeria", iso: "NGA", percentage: 30 },
      { name: "Sweden", iso: "SWE", percentage: 85 },
      { name: "Norway", iso: "NOR", percentage: 90 },
      { name: "Switzerland", iso: "CHE", percentage: 95 },
      { name: "Turkey", iso: "TUR", percentage: 50 },
      { name: "Indonesia", iso: "IDN", percentage: 40 },
      { name: "Poland", iso: "POL", percentage: 65 },
      { name: "Belgium", iso: "BEL", percentage: 75 },
      { name: "Austria", iso: "AUT", percentage: 80 },
      { name: "United Arab Emirates", iso: "ARE", percentage: 85 },
      { name: "New Zealand", iso: "NZL", percentage: 90 },
      { name: "Singapore", iso: "SGP", percentage: 95 },
      { name: "Albania", iso: "ALB", percentage: 50 },
      { name: "Greece", iso: "GRC", percentage: 60 },
      { name: "Portugal", iso: "PRT", percentage: 70 },
      { name: "Ireland", iso: "IRL", percentage: 80 },
      { name: "Denmark", iso: "DNK", percentage: 85 },
      { name: "Finland", iso: "FIN", percentage: 85 },
      { name: "Ukraine", iso: "UKR", percentage: 30 },
      { name: "Vietnam", iso: "VNM", percentage: 50 },
      { name: "Thailand", iso: "THA", percentage: 55 },
      { name: "Malaysia", iso: "MYS", percentage: 60 },
      { name: "Chile", iso: "CHL", percentage: 65 },
      { name: "Colombia", iso: "COL", percentage: 45 },
      { name: "Peru", iso: "PER", percentage: 40 },
      { name: "Pakistan", iso: "PAK", percentage: 25 },
      { name: "Bangladesh", iso: "BGD", percentage: 30 },
      { name: "Philippines", iso: "PHL", percentage: 45 },
      { name: "Morocco", iso: "MAR", percentage: 40 },
      { name: "Kenya", iso: "KEN", percentage: 35 }
    ];

    let map;
    let geojsonLayer;

    function getColor(d) {
      return d >= 80 ? '#10b981' :
             d >= 50 ? '#3b82f6' :
             d >= 20 ? '#f59e0b' :
             d > 0   ? '#ef4444' :
                       '#334155';
    }

    function initMap() {
      map = L.map('map', {
        center: [20, 0],
        zoom: 2,
        minZoom: 2,
        maxBounds: [[-90, -180], [90, 180]]
      });

      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 19
      }).addTo(map);

      fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
        .then(response => response.json())
        .then(data => {
          geojsonLayer = L.geoJSON(data, {
            style: style,
            onEachFeature: onEachFeature
          }).addTo(map);
        })
        .catch(err => console.error("Could not load GeoJSON map data:", err));
    }

    function getCountryPercentage(iso, name) {
      const match = countryData.find(c => c.iso === iso || c.name.toLowerCase() === name.toLowerCase());
      return match ? match.percentage : 0;
    }

    function style(feature) {
      const pct = getCountryPercentage(feature.id, feature.properties.name);
      return {
        fillColor: getColor(pct),
        weight: 1,
        opacity: 1,
        color: '#475569',
        fillOpacity: 0.7
      };
    }

    function onEachFeature(feature, layer) {
      const pct = getCountryPercentage(feature.id, feature.properties.name);
      layer.bindTooltip(`<strong>${feature.properties.name}</strong><br/>Score: ${pct}%`, {
        sticky: true
      });
      layer.on({
        mouseover: (e) => {
          const l = e.target;
          l.setStyle({ weight: 2, color: '#f8fafc', fillOpacity: 0.9 });
        },
        mouseout: (e) => {
          geojsonLayer.resetStyle(e.target);
        }
      });
    }

    function renderCountryList() {
      const grid = document.getElementById('countryGrid');
      grid.innerHTML = '';

      const sorted = [...countryData].sort((a, b) => b.percentage - a.percentage);

      sorted.forEach(c => {
        const card = document.createElement('div');
        card.className = 'country-card';
        card.dataset.name = c.name.toLowerCase();
        card.innerHTML = `
          <div class="country-header">
            <span class="country-name">${c.name}</span>
            <span class="country-percentage">${c.percentage}%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: ${c.percentage}%; background-color: ${getColor(c.percentage)}"></div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCountries() {
      const query = document.getElementById('countrySearch').value.toLowerCase();
      const cards = document.querySelectorAll('.country-card');
      cards.forEach(card => {
        if (card.dataset.name.includes(query)) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }

    function calculateStats() {
      const totalSum = countryData.reduce((acc, curr) => acc + curr.percentage, 0);
      const avg = (totalSum / countryData.length).toFixed(2);
      
      document.getElementById('totalWorldPercent').innerText = `${avg}%`;
      document.getElementById('totalCount').innerText = countryData.length;
      document.getElementById('hundredCount').innerText = countryData.filter(c => c.percentage === 100).length;
      document.getElementById('aboveFiftyCount').innerText = countryData.filter(c => c.percentage >= 50).length;
      document.getElementById('zeroCount').innerText = countryData.filter(c => c.percentage === 0).length;
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      event.target.classList.add('active');
      const activeContent = document.getElementById(tabId);
      activeContent.classList.add('active');

      if (tabId === 'map-view' && map) {
        setTimeout(() => { map.invalidateSize(); }, 100);
      }
    }

    window.onload = () => {
      initMap();
      renderCountryList();
      calculateStats();
    };
  </script>
</body>
</html>
