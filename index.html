<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Street View Coverage & Analyzer (sv-map 2026 Dataset)</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 320px;
      background: #1e1e2e;
      border-right: 1px solid #2d2d3d;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      z-index: 1000;
      box-shadow: 4px 0 15px rgba(0,0,0,0.3);
    }

    h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #89b4fa;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.8rem;
      color: #a6adc8;
      font-weight: 500;
    }

    input[type="text"], select {
      background: #181825;
      border: 1px solid #313244;
      color: #cdd6f4;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    input[type="text"]:focus, select:focus {
      border-color: #89b4fa;
    }

    .btn-analyze {
      background: #89b4fa;
      color: #11111b;
      border: none;
      padding: 0.75rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-analyze:hover {
      background: #b4befe;
    }

    .btn-analyze:disabled {
      background: #45475a;
      color: #7f849c;
      cursor: not-allowed;
    }

    .results-card {
      background: #181825;
      border: 1px solid #313244;
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .results-card h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #a6adc8;
    }

    .coverage-value {
      font-size: 2.2rem;
      font-weight: 700;
      color: #a6e3a1;
    }

    .status-text {
      font-size: 0.8rem;
      color: #9399b2;
    }

    .legend {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 0.85rem;
      margin-top: auto;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .legend-color {
      width: 14px;
      height: 4px;
      border-radius: 2px;
    }

    #map {
      flex: 1;
      height: 100%;
      background: #000;
    }

    .progress-bar-bg {
      background: #313244;
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 0.25rem;
    }

    .progress-bar-fill {
      background: #a6e3a1;
      height: 100%;
      width: 0%;
      transition: width 0.2s ease;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>Street View Coverage</h2>

    <div class="input-group">
      <label for="dataset-select">sv-map Archive Dataset</label>
      <select id="dataset-select">
        <option value="https://d3q761cy2sygif.cloudfront.net/2026-08-01.pmtiles" selected>August 1, 2026 (Latest)</option>
        <option value="https://d3q761cy2sygif.cloudfront.net/2026-07-01.pmtiles">July 1, 2026</option>
        <option value="https://d3q761cy2sygif.cloudfront.net/2026-01-01.pmtiles">January 1, 2026</option>
        <option value="google-live">Google Live Raster Tile Layer</option>
      </select>
    </div>

    <div class="input-group">
      <label for="bbox-input">Bounding Box (South, West, North, East)</label>
      <input type="text" id="bbox-input" value="42.605, 20.575, 42.625, 20.605" />
    </div>

    <button id="analyze-btn" class="btn-analyze">Analyze Area</button>

    <div class="results-card">
      <h3>Coverage Percentage</h3>
      <div id="coverage-pct" class="coverage-value">0.0%</div>
      <div class="progress-bar-bg">
        <div id="progress-fill" class="progress-bar-fill"></div>
      </div>
      <div id="status-label" class="status-text">Ready</div>
    </div>

    <div class="legend">
      <div class="legend-item">
        <div class="legend-color" style="background: #38bdf8;"></div>
        <span>Worldwide Blue Lines (sv-map Layer)</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: #a6e3a1;"></div>
        <span>Covered Road (Analyzed)</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: #f38ba8;"></div>
        <span>Missing Road (Analyzed)</span>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- PMTiles Engine for Leaflet (sv-map support) -->
  <script src="https://unpkg.com/pmtiles@2.11.0/dist/index.js"></script>

  <script>
    // Initialize map focused on default Kosovo coordinates
    const map = L.map('map').setView([42.615, 20.59], 13);

    // Dark Map Basemap (No Key Needed)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);

    // Dynamic layer holder for sv-map dataset
    let svCoverageLayer = null;

    function loadSvMapLayer(url) {
      if (svCoverageLayer) {
        map.removeLayer(svCoverageLayer);
      }

      if (url === 'google-live') {
        svCoverageLayer = L.tileLayer('https://mt{s}.google.com/vt/lyrs=sv&x={x}&y={y}&z={z}', {
          subdomains: ['0', '1', '2', '3'],
          maxZoom: 20,
          opacity: 0.8
        }).addTo(map);
      } else {
        // Load PMTiles protocol from sv-map CloudFront source
        const p = new pmtiles.PMTiles(url);
        svCoverageLayer = pmtiles.leafletRasterLayer(p, {
          maxZoom: 20,
          opacity: 0.85
        }).addTo(map);
      }
    }

    // Load August 1, 2026 sv-map archive dataset on boot
    loadSvMapLayer('https://d3q761cy2sygif.cloudfront.net/2026-08-01.pmtiles');

    // Switch dataset when select dropdown is changed
    document.getElementById('dataset-select').addEventListener('change', (e) => {
      loadSvMapLayer(e.target.value);
    });

    let bboxRectangle = null;
    let analyzedLayers = L.layerGroup().addTo(map);

    const analyzeBtn = document.getElementById('analyze-btn');
    const bboxInput = document.getElementById('bbox-input');
    const coveragePctElem = document.getElementById('coverage-pct');
    const progressFill = document.getElementById('progress-fill');
    const statusLabel = document.getElementById('status-label');

    // Parse bounding box string: South, West, North, East
    function parseBBox(str) {
      const parts = str.split(',').map(n => parseFloat(n.trim()));
      if (parts.length !== 4 || parts.some(isNaN)) return null;
      return { south: parts[0], west: parts[1], north: parts[2], east: parts[3] };
    }

    // Check individual coordinate for Street View metadata
    async function checkStreetViewCoverage(lat, lng) {
      const url = `https://cbks0.google.com/cbk?output=json&ll=${lat},${lng}`;
      try {
        const response = await fetch(url);
        const data = await response.json();
        return !!(data && data.Location && data.Location.panoId);
      } catch (e) {
        return false;
      }
    }

    analyzeBtn.addEventListener('click', async () => {
      const bbox = parseBBox(bboxInput.value);
      if (!bbox) {
        alert('Invalid Bounding Box format! Use: South, West, North, East');
        return;
      }

      // UI updates
      analyzeBtn.disabled = true;
      analyzedLayers.clearLayers();
      statusLabel.innerText = 'Fetching road network...';
      coveragePctElem.innerText = '0.0%';
      progressFill.style.width = '0%';

      // Draw bounding box visual on map
      const bounds = [[bbox.south, bbox.west], [bbox.north, bbox.east]];
      if (bboxRectangle) map.removeLayer(bboxRectangle);
      bboxRectangle = L.rectangle(bounds, { color: "#89b4fa", weight: 2, fillOpacity: 0.05 }).addTo(map);
      map.fitBounds(bounds);

      // Fetch roads inside bounding box via Overpass API
      const overpassQuery = `
        [out:json][timeout:25];
        (
          way["highway"](${bbox.south},${bbox.west},${bbox.north},${bbox.east});
        );
        out body;
        >;
        out skel format=json;
      `;

      try {
        const response = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: overpassQuery
        });

        const data = await response.json();
        const nodes = {};
        
        data.elements.forEach(el => {
          if (el.type === 'node') {
            nodes[el.id] = [el.lat, el.lon];
          }
        });

        const ways = data.elements.filter(el => el.type === 'way');
        if (ways.length === 0) {
          statusLabel.innerText = 'No roads found in bounding box.';
          analyzeBtn.disabled = false;
          return;
        }

        const samplePoints = [];
        ways.forEach(way => {
          for (let i = 0; i < way.nodes.length - 1; i++) {
            const p1 = nodes[way.nodes[i]];
            const p2 = nodes[way.nodes[i+1]];
            if (p1 && p2) {
              const midLat = (p1[0] + p2[0]) / 2;
              const midLng = (p1[1] + p2[1]) / 2;
              samplePoints.push({ lat: midLat, lng: midLng, p1, p2 });
            }
          }
        });

        statusLabel.innerText = `Testing ${samplePoints.length} road samples...`;

        let coveredCount = 0;
        let checkedCount = 0;

        const batchSize = 10;
        for (let i = 0; i < samplePoints.length; i += batchSize) {
          const batch = samplePoints.slice(i, i + batchSize);
          
          await Promise.all(batch.map(async (point) => {
            const hasSV = await checkStreetViewCoverage(point.lat, point.lng);
            if (hasSV) coveredCount++;

            const lineColor = hasSV ? '#a6e3a1' : '#f38ba8';
            L.polyline([point.p1, point.p2], { color: lineColor, weight: 4, opacity: 0.85 }).addTo(analyzedLayers);
          }));

          checkedCount += batch.length;
          const currentPct = ((coveredCount / checkedCount) * 100).toFixed(1);
          coveragePctElem.innerText = `${currentPct}%`;
          progressFill.style.width = `${(checkedCount / samplePoints.length) * 100}%`;
          statusLabel.innerText = `Analyzing... (${checkedCount}/${samplePoints.length})`;
        }

        const finalPct = ((coveredCount / samplePoints.length) * 100).toFixed(1);
        coveragePctElem.innerText = `${finalPct}%`;
        statusLabel.innerText = `Analysis complete! (${coveredCount}/${samplePoints.length} covered)`;

      } catch (err) {
        console.error(err);
        statusLabel.innerText = 'Error processing coverage request.';
      } finally {
        analyzeBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
