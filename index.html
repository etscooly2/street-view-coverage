<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Street View Coverage Map & Percentage Tracker</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #sidebar {
      width: 320px;
      background: #1e1e2e;
      color: #cdd6f4;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.3);
      z-index: 1000;
    }

    h2 {
      font-size: 1.2rem;
      color: #89b4fa;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 0.85rem;
      color: #a6adc8;
    }

    input {
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #45475a;
      background: #313244;
      color: #fff;
      font-size: 0.9rem;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 4px;
      background: #89b4fa;
      color: #11111b;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #b4befe;
    }

    #stats-card {
      background: #313244;
      border-radius: 6px;
      padding: 15px;
      margin-top: 10px;
    }

    .stat-val {
      font-size: 1.8rem;
      font-weight: bold;
      color: #a6e3a1;
    }

    #progress-container {
      width: 100%;
      background: #45475a;
      border-radius: 4px;
      height: 8px;
      overflow: hidden;
      margin-top: 8px;
    }

    #progress-bar {
      width: 0%;
      height: 100%;
      background: #a6e3a1;
      transition: width 0.3s;
    }

    #map {
      flex: 1;
      height: 100%;
    }

    .legend {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 0.85rem;
      margin-top: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-box {
      width: 14px;
      height: 4px;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>Street View Coverage</h2>
    
    <div class="input-group">
      <label for="api-key">Google Maps API Key</label>
      <input type="password" id="api-key" placeholder="Enter API Key">
    </div>

    <div class="input-group">
      <label for="bbox">Bounding Box (South, West, North, East)</label>
      <input type="text" id="bbox" value="42.605, 20.575, 42.625, 20.605">
    </div>

    <button id="start-btn" onclick="runCoverageAnalysis()">Analyze Area</button>

    <div id="stats-card">
      <label>Coverage Percentage</label>
      <div class="stat-val" id="coverage-percentage">0.0%</div>
      <div id="progress-container">
        <div id="progress-bar"></div>
      </div>
      <p id="status-text" style="font-size: 0.8rem; margin-top: 8px; color: #a6adc8;">Ready</p>
    </div>

    <div class="legend">
      <div class="legend-item">
        <div class="color-box" style="background: #2ea44f;"></div>
        <span>Covered by Street View</span>
      </div>
      <div class="legend-item">
        <div class="color-box" style="background: #da3633;"></div>
        <span>Missing Street View</span>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialize Leaflet Map
    const map = L.map('map').setView([42.615, 20.590], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let layerGroup = L.layerGroup().addTo(map);

    async function runCoverageAnalysis() {
      const apiKey = document.getElementById('api-key').value.trim();
      const bboxInput = document.getElementById('bbox').value.trim();
      const statusText = document.getElementById('status-text');
      
      if (!apiKey) {
        alert("Please enter a Google Maps API key.");
        return;
      }

      layerGroup.clearLayers();
      statusText.innerText = "Fetching OpenStreetMap roads...";

      const [south, west, north, east] = bboxInput.split(',').map(n => n.trim());

      // Fetch roads from Overpass API
      const overpassQuery = `
        [out:json];
        way["highway"](${south},${west},${north},${east});
        out geometry;
      `;
      
      try {
        const response = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: overpassQuery
        });
        const data = await response.json();

        if (!data.elements || data.elements.length === 0) {
          statusText.innerText = "No roads found in this area.";
          return;
        }

        const ways = data.elements;
        let totalSamplePoints = 0;
        let coveredPoints = 0;
        let processed = 0;

        statusText.innerText = `Analyzing ${ways.length} road segments...`;

        for (const way of ways) {
          if (!way.geometry) continue;

          for (let i = 0; i < way.geometry.length - 1; i++) {
            const p1 = way.geometry[i];
            const p2 = way.geometry[i + 1];

            // Sample midpoint of segment
            const midLat = (p1.lat + p2.lat) / 2;
            const midLng = (p1.lon + p2.lon) / 2;

            totalSamplePoints++;

            // Query Google Street View Metadata API (returns JSON)
            const metaUrl = `https://maps.googleapis.com/maps/api/streetview/metadata?location=${midLat},${midLng}&key=${apiKey}`;

            try {
              const res = await fetch(metaUrl);
              const meta = await res.json();

              let isCovered = meta.status === "OK";
              if (isCovered) coveredPoints++;

              // Draw road segment on map
              L.polyline([[p1.lat, p1.lon], [p2.lat, p2.lon]], {
                color: isCovered ? '#2ea44f' : '#da3633',
                weight: 4,
                opacity: 0.8
              }).addTo(layerGroup);

            } catch (err) {
              console.error("API error:", err);
            }

            processed++;
            
            // Update UI percentage stats
            const pct = ((coveredPoints / totalSamplePoints) * 100).toFixed(1);
            document.getElementById('coverage-percentage').innerText = `${pct}%`;
            document.getElementById('progress-bar').style.width = `${(processed / totalSamplePoints) * 100}%`;
            statusText.innerText = `Checked ${processed} segments...`;
          }
        }

        statusText.innerText = "Analysis Complete!";

      } catch (err) {
        console.error(err);
        statusText.innerText = "Error fetching map data.";
      }
    }
  </script>
</body>
</html>
